# Tag a version, get installers. Nothing else publishes.
#
# This is the wall between working and shipping: master moves as freely as you
# like and nobody downloads it. Only a `v*` tag becomes something a user can
# install, and it is built from a clean checkout by a machine that has never
# seen your desk — so what ships is exactly what is committed, never what
# happened to be lying around locally.
#
#   npm version patch && git push --follow-tags
#
# Two builds, two runners, one release. macOS cannot cross-build a signed
# Windows installer and Windows cannot notarize, so each platform is built by a
# machine of its own kind and the artifacts are joined at the end. The release
# is created once, by the job that waits for both — a draft release created
# twice is a race that produces two drafts and a confusing morning.
#
# Secrets this needs:
#   CSC_LINK            base64 of the Developer ID .p12  ) omit both and the
#   CSC_KEY_PASSWORD    its export password               ) mac build is unsigned
#   APPLE_API_KEY_P8    base64 of the App Store Connect .p8  ) omit these and
#   APPLE_API_KEY_ID    the key's ID                         ) it is signed
#   APPLE_API_ISSUER    the issuer UUID                      ) but not notarized
#   WINDOWS_CSC_LINK       base64 of an Authenticode .pfx  ) omit both and the
#   WINDOWS_CSC_KEY_PASSWORD  its password                 ) Windows build is
#                                                          ) unsigned, and says so
#
# Note the name: electron-builder's APPLE_API_KEY is a PATH to the .p8, not its
# contents, so the secret holds the bytes under a different name and the step
# below writes them to a file and points APPLE_API_KEY at it.
name: release

on:
  push:
    tags: ['v*']

jobs:
  # ---- macOS ---------------------------------------------------------------
  mac:
    runs-on: macos-14   # pinned: a runner bump changes the SDK the app links against
    # Secrets are lifted into env here because `if:` conditions cannot read the
    # secrets context — a workflow that tries fails validation before any job
    # starts, with "this run likely failed because of a workflow file issue" and
    # no log to read. env is readable from a step-level `if`, so the checks below
    # go through these.
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    timeout-minutes: 60
    steps:
      # Stop in the first seconds rather than after half an hour of building and
      # notarizing something that cannot then be uploaded.
      - name: Check we can publish before doing any work
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          missing=
          [ -z "$CSC_LINK" ]          && missing="$missing CSC_LINK"
          [ -z "$APPLE_API_KEY_P8" ]  && missing="$missing APPLE_API_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — a release must be signed, notarized and publishable, so stopping now rather than after 45 minutes of building."
            exit 1
          fi
          echo "all release credentials present"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 44 MB of Whisper weights, gitignored and fetched at pack time. Keyed on
      # the fetch script so a model change busts the cache and nothing else does.
      - name: Cache Whisper weights
        uses: actions/cache@v4
        with:
          path: build/models
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/fetch-model.mjs', 'src/main/stt-model.js') }}

      - run: npm ci

      # The gate. A red test never becomes a download.
      - run: npm test

      # The key has to exist as a file on disk — see the note at the top. Runner
      # disks are destroyed with the job, so this never outlives the build.
      - name: Stage the notarization key
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # Build only — publishing is a separate job below, deliberately.
      #
      # `--publish always` would upload latest-mac.yml as electron-builder wrote
      # it, which is before the notarization staple changes the dmg and before
      # fix-update-metadata corrects the recorded hash. The release would install
      # fine and every later auto-update would fail its checksum. Uploading after
      # the build has fully finished is the only way that file can be true.
      #
      # `predist` pulls the weights; the cache above usually makes it a no-op.
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist

      # Refuse to publish something Gatekeeper would reject. This is the check a
      # user performs by double-clicking, and it is silent at build time.
      - name: Check what Gatekeeper makes of it
        run: |
          set -e
          for dmg in release/*.dmg; do
            echo "== $dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
            xcrun stapler validate "$dmg"
          done

      # The zip is what an update installs, and it is built from the .app rather
      # than from the dmg — so it is stapled only if the staple reached the .app
      # before the zip was written. That ordering is electron-builder's, not
      # ours, and it is invisible: an unstapled app installs perfectly on the
      # machine that downloaded it and then fails Gatekeeper on the first launch
      # that happens offline. Unpack what was actually built and look.
      - name: Check the zip an update would install
        run: |
          set -e
          for zip in release/*.zip; do
            echo "== $zip"
            work="$(mktemp -d)"
            ditto -x -k "$zip" "$work"
            app="$work/Nami.app"
            [ -d "$app" ] || { echo "no Nami.app inside $zip"; exit 1; }
            codesign --verify --deep --strict "$app"
            spctl -a -vvv -t exec "$app"
            xcrun stapler validate "$app"
            rm -rf "$work"
          done

      # Prove the update metadata describes the bytes being uploaded, not the
      # bytes that existed before stapling.
      - name: Check the update metadata
        run: node scripts/check-update-metadata.mjs

      # And prove the app itself carries only what it needs to run. npm test
      # already checked that electron-builder.yml still says so; this opens the
      # bundle that was actually produced and looks.
      - name: Check what is inside the app
        run: node scripts/check-bundle.mjs

      - name: Report what shipped
        if: always()
        run: |
          for app in release/mac*/Nami.app; do
            [ -d "$app" ] || continue
            echo "== $app"
            codesign -dv "$app" 2>&1 | grep -E 'Identifier|TeamIdentifier' || echo "  unsigned"
            spctl -a -vvv -t install "$app" 2>&1 | tail -2 || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          # latest-mac.yml is as much a release artifact as the dmg: without it
          # no installed Nami can ever see this version.
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  # ---- Windows -------------------------------------------------------------
  windows:
    runs-on: windows-2022   # pinned for the same reason macos-14 is
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Whisper weights
        uses: actions/cache@v4
        with:
          path: build/models
          key: whisper-${{ runner.os }}-${{ hashFiles('scripts/fetch-model.mjs', 'src/main/stt-model.js') }}

      - run: npm ci

      # The same gate, on the other operating system — and it is not a
      # formality. Roughly a hundred and fifty tests failed the first time this
      # suite ran on Windows, every one of them about a real difference in how
      # paths, shells or PATH work there. A Mac-only CI would have shipped all
      # of it.
      - run: npm test

      # Unsigned is allowed and is not silent. Windows shows SmartScreen's
      # "unrecognised app" wall for an unsigned installer, which is the Windows
      # equivalent of the Gatekeeper warning the Mac build exists to avoid — so
      # a release built without a certificate says so in the log rather than
      # being discovered by whoever downloads it.
      - name: Note whether this build will be signed
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if [ -z "$WINDOWS_CSC_LINK" ]; then
            echo "::warning::No WINDOWS_CSC_LINK — the installer will be unsigned, and Windows SmartScreen will warn every person who downloads it."
          else
            echo "signing certificate present"
          fi

      - name: Build the installers
        env:
          # electron-builder reads these two for Authenticode signing; with
          # neither set it builds unsigned rather than failing.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist

      # Same two checks the Mac build runs, for the same reasons: that the
      # metadata describes the bytes being uploaded, and that the app carries
      # only what it needs to run.
      - name: Check the update metadata
        run: node scripts/check-update-metadata.mjs

      - name: Check what is inside the app
        run: node scripts/check-bundle.mjs

      # Does the thing a user would double-click actually install? A silent
      # per-user install into a scratch directory, then look for the exe it was
      # supposed to put there. This catches an installer that builds perfectly
      # and cannot run — a missing icon, an NSIS script error, a target the
      # runner's Defender objects to.
      - name: Install it, the way a person would
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'nami-install-test'
          Start-Process -FilePath release\Nami-x64.exe -ArgumentList '/S', "/D=$target" -Wait
          $exe = Join-Path $target 'Nami.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem $target -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 | Out-String | Write-Host
            throw "the installer ran and left no Nami.exe in $target"
          }
          "installed: $((Get-Item $exe).VersionInfo.FileVersion)" | Write-Host

      - name: Report what shipped
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0}  {1:n0} bytes  signature={2}" -f $_.Name, $_.Length, $sig.Status | Write-Host
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1

  # ---- the release ---------------------------------------------------------
  # One job, after both, so the draft is created once and carries everything.
  # If either build fails there is no release at all — half a release is worse
  # than none, because the half that exists is what people download.
  publish:
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    # The release lands on this same repo, so the built-in token can create it —
    # no hand-made PAT to rotate. It only needs to be told it may write.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather what the two builds made
        run: |
          mkdir -p release
          mv artifacts/*/* release/
          ls -la release/

      # Both metadata files have to be there. A release with latest-mac.yml and
      # no latest.yml installs fine on Windows and can never update itself — the
      # exact failure the Mac side already learned to check for.
      - name: Both platforms are actually here
        run: |
          set -e
          for f in latest-mac.yml latest.yml; do
            [ -f "release/$f" ] || { echo "::error::release/$f missing — one of the two builds did not upload its update metadata"; exit 1; }
          done
          ls release/*.dmg release/*.exe >/dev/null

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo Shebidab/nami \
            --draft \
            --title "Nami ${GITHUB_REF_NAME#v}" \
            --notes "macOS: signed and notarized, Apple Silicon and Intel. Windows 10 and 11: installers for x64 and ARM64." \
            release/*.dmg release/*.zip release/*.exe release/*.blockmap release/latest-mac.yml release/latest.yml
