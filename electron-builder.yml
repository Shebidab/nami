appId: ai.dainami.nami
productName: Nami

# Nami is Dainami's, and without this line electron-builder said otherwise. With
# no `copyright` it builds NSHumanReadableCopyright out of `author`, so every
# shipped bundle carried "Copyright © 2026 Calvin Hia" in its Info.plist and in
# the About panel, a string nobody had written anywhere. The year is the
# release's, so it is written out rather than taken from the build machine's
# clock. main.js sets the same string on the About panel for dev runs.
copyright: Copyright © 2026 Dainami AI
directories:
  output: release
  buildResources: build

# Releases go to a DIFFERENT repo from the source, and that is the point.
#
# Installers and update metadata go to this repo's own releases. An app that
# updates itself has to read its feed from somewhere public, and this repo is
# public, so no token ships inside a copy of Nami and CI needs no PAT — the
# built-in GITHUB_TOKEN reaches its own repo. See .github/workflows/release.yml.
#
# Downloads used to live in a separate mrdainami/nami-releases because the
# source was closed. Nothing had shipped when it opened, so they moved here
# rather than leaving the star count on a repo with no code in it.
# This fork publishes to its own releases. electron-updater reads app-update.yml
# out of the packaged app, which is generated from exactly these three lines —
# leave them pointing upstream and every installed copy of this build checks a
# repository that will never hold a Windows installer.
publish:
  provider: github
  owner: Shebidab
  repo: nami
  # Drafts, deliberately. A build lands where it can be looked at and the notes
  # written before anyone can download it, and pressing Publish stays a human
  # decision — the moment it goes live is the moment every installed Nami starts
  # offering it. Set releaseType: release here if that ever becomes tedious.
  releaseType: draft

files:
  - src/**/*
  - package.json
  - '!**/*.map'

  # --- weight, in descending order of how much it saves -------------------
  # The ORT tarball carries every platform — darwin, linux and win32, two
  # architectures each, 209 MB in total. A build can load exactly one of those
  # directories; everything else is weight the user downloads and never opens.
  #
  # ${platform} and ${arch}, and ${platform} specifically: the macro that reads
  # more naturally here, ${os}, belongs to artifactName and is NOT substituted in
  # a file pattern. It does not fail — `!(${os})` simply matches all three
  # directories, and the packaged app ships with no ORT binary at all. It
  # launches. Dictation is dead, on a code path no test exercises, and the only
  # visible sign is the app being 65 MB lighter than it ought to be. ${platform}
  # gives darwin / win32 / linux, which is exactly how these are named.
  #
  # Written as "keep mine, drop the rest" so an architecture or an operating
  # system nobody thought of is excluded by default instead of shipped by
  # accident.
  - '!node_modules/onnxruntime-node/bin/napi-v3/!(${platform})/**'
  - '!node_modules/onnxruntime-node/bin/napi-v3/${platform}/!(${arch})/**'

  # node-pty and sharp do it the other way round: one npm PACKAGE per
  # architecture, pulled in as an optional dependency. That difference is the
  # whole problem — `npm install` fetches only the package matching the machine
  # it runs on, so cross-building arm64 from an x64 runner produced a bundle
  # with an x64 node-pty in it. It packaged, installed and launched, and every
  # terminal tile would have said "[node-pty unavailable]" on the one
  # architecture nobody here can test by hand.
  #
  # Two halves to the fix, and both are needed. CI installs the other
  # architecture's packages before building (--force, because npm refuses a cpu
  # that is not its own), and these lines keep each build to its own. The half
  # that catches the next version of this is neither: scripts/check-bundle.mjs
  # reads the PE header of every shipped binary, because a directory named
  # win32-arm64 is not evidence that what is inside it is.
  - '!node_modules/@lydell/node-pty-*-!(${arch})/**'
  - '!node_modules/@img/sharp-*-!(${arch})/**'

  # 68 MB: transformers declares onnxruntime-web as a hard dependency, but the
  # build we actually load (dist/transformers.node.mjs) imports only node:*,
  # onnxruntime-common, onnxruntime-node and sharp. Nothing reaches for -web.
  - '!node_modules/onnxruntime-web/**'

  # 28 MB: of that dist we need exactly one file. The rest is the browser build,
  # its 21.6 MB ORT wasm, and source maps — none of it reachable from main.
  - '!node_modules/@huggingface/transformers/dist/!(transformers.node.mjs)'

# whisper-base (multilingual), so a fresh install transcribes with no network and no
# account. main.js copies this into userData on first launch: the app bundle is
# read-only, and a later model upgrade has to land somewhere writable.
# Populated by `npm run fetch-model` (wired to prepack).
extraResources:
  - from: build/models
    to: models
    filter: ['**/*']

# Native binaries cannot be dlopen'd from inside an asar archive.
asarUnpack:
  - '**/node_modules/onnxruntime-node/bin/**'
  - '**/node_modules/@lydell/node-pty/**'
  - '**/*.node'

# Neither afterAllArtifactBuild nor the dmg block below does anything on a
# Windows build: the hook returns immediately when the build produced no dmg,
# and `dmg:` is simply not consulted. Left unguarded on purpose — a config that
# describes each target and lets the other one ignore it stays readable, where
# a platform conditional wrapped around half this file would not.

# The dmg is what the user downloads, so it is what carries the quarantine flag
# and what Gatekeeper judges first. electron-builder signs the app and leaves the
# container unsigned, which reads as "unidentified developer" before anyone has
# seen the app. Sign it here; notarize it in the hook below.
dmg:
  sign: true
afterAllArtifactBuild: scripts/notarize-dmg.mjs

# No version in the installer's name, on purpose. The download button on
# nami.dainami.ai points at
#   github.com/mrdainami/nami/releases/latest/download/Nami-arm64.dmg
# and that path can only resolve if the newest release holds an asset with
# exactly that name. Put the version back in and the site's link dies at the
# next release — silently, because GitHub answers a missing asset with its own
# 404 page rather than anything the site could notice.
# The version is still in the release title, the tag, and the app's About.
artifactName: ${productName}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    # What a person downloads. Carries the quarantine flag, gets judged by
    # Gatekeeper, and is what the website links to.
    - target: dmg
      arch: [arm64, x64]
    # What the updater installs, and the only thing it can install: on macOS
    # electron-updater hands the swap to Squirrel.Mac, which unpacks a zip of
    # the .app. A release with only dmgs on it has nothing an update can use.
    # Nobody clicks this file; it exists for latest-mac.yml to point at.
    - target: zip
      arch: [arm64, x64]
  # What Nami offers to open. Declaring a type only puts Nami in Finder's
  # "Open With" — it never takes a default; the person still picks one.
  #
  # The list is short on purpose. These are documents Nami renders as a tile
  # today and that a workbench plausibly owns. Images, video, audio and PDF
  # belong to Preview, and .json / .yml belong to an editor: appearing in
  # everything's Open With menu is noise, not a feature. Keep this in step with
  # OPEN_EXT in src/main/open-with.js, which decides where the file lands.
  #
  # rank Alternate, not electron-builder's default of Default: a workbench does
  # not own markdown. Alternate keeps Nami in the Open With list without ever
  # winning the type on its own, so installing Nami never silently changes what
  # a double-click does. Setting it as the default stays a deliberate act —
  # Get Info → Open With → Change All.
  fileAssociations:
    - ext: [md, markdown, mdx]
      name: Markdown document
      role: Editor
      rank: Alternate
    - ext: [txt, text]
      name: Plain text document
      role: Editor
      rank: Alternate
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Nami uses your microphone so you can dictate into a session instead of
      typing.

win:
  # NSIS is what a Windows user means by "an installer": one .exe, a Start menu
  # entry, an uninstaller in Apps & features, and an entry point electron-updater
  # can replace in place. A portable build was considered and rejected — the
  # updater cannot swap a file the user is running out of their Downloads
  # folder, so it would ship a Nami that can never update itself.
  #
  # Both architectures. Windows on ARM runs an x64 build under emulation, and it
  # runs it badly: the terminal is the point of Nami and ConPTY under emulation
  # is where that shows. An arm64 build is a few minutes of CI and the whole
  # difference on a Surface or a Dev Kit.
  #
  # Asking for two architectures gets three installers: one per arch, plus a
  # 291 MB one carrying both, named Nami.exe. Nothing configures that away —
  # separate target entries produce it too. Nobody should download it, and
  # nothing should update from it, so scripts/fix-update-metadata.mjs deletes it
  # and takes it out of latest.yml once the build has finished. The release step
  # uploads Nami-*.exe, which never matched it in the first place.
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png     # electron-builder renders the .ico from this
  # KNOWN, and deliberately not fixed here. A real per-user install shows
  # "Nami 0.5.1 — Calvin Hia" in Apps & features: NSIS writes its Publisher from
  # appInfo.companyName, which electron-builder reads from `author.name` in
  # package.json and from nowhere else. This is the same root as the Info.plist
  # copyright the `copyright:` line at the top of this file exists to correct,
  # surfacing a second time.
  #
  # There is no win: key that overrides it — `publisherName` moved under
  # signtoolOptions in electron-builder 26 and governs signature verification
  # rather than this string. The only lever is `author` in package.json, which
  # is the Mac bundle's author too, so changing it is a decision about the
  # product rather than about the Windows build. Left for whoever owns that.
  # Same list as the Mac's fileAssociations and for the same reasons: Nami is
  # offered as an option in "Open with", it never takes a default, and the list
  # stays short because appearing under every file in Explorer is noise.
  # Keep in step with OPEN_EXT in src/main/open-with.js.
  fileAssociations:
    - ext: [md, markdown, mdx]
      name: Markdown document
      description: Markdown document
    - ext: [txt, text]
      name: Plain text document
      description: Plain text document

nsis:
  # Per-user, and not negotiable. A machine-wide install needs elevation, which
  # means a UAC prompt before anyone has seen the app — and, worse, it means
  # every later auto-update needs one too. electron-updater installs silently in
  # the background; an update that stops to ask for administrator rights is an
  # update that never happens.
  #
  # Measured, because "what if someone runs it as administrator anyway" is the
  # first thing anyone asks about a per-user installer. Run elevated, it still
  # installs per-user: same %LOCALAPPDATA%\Programs\Nami, same HKCU uninstall
  # entry, same user Start-menu shortcut, and nothing in Program Files or HKLM.
  # The files end up owned by BUILTIN\Administrators rather than by the user —
  # that is just what an elevated process creates — but LOCALAPPDATA's inherited
  # ACL still grants the user Full Control, so the app runs unelevated and a
  # background update can still replace Nami.exe. Verified both, by replacing it.
  #
  # The one case that does bite: elevating as a DIFFERENT administrator account
  # installs into that account's profile, where the original user cannot see it.
  # Nothing here can prevent that, and nothing here should try — it is what
  # per-user means.
  oneClick: false
  perMachine: false
  allowElevation: false
  # Let people choose the folder. Nami is a workbench, and the sort of person
  # who installs one has opinions about where programs go.
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false      # nobody asked for another desktop icon
  createStartMenuShortcut: true
  shortcutName: Nami
  # The uninstaller leaves userData alone by default, which is right: settings,
  # keys and the desk you left open are the user's, and a reinstall should find
  # them. deleteAppDataOnUninstall stays false, deliberately and by omission of
  # nothing — it is written out so the decision is visible.
  deleteAppDataOnUninstall: false
  # Differential updates. electron-updater downloads only the changed blocks
  # between two versions when both carry a blockmap, which turns a ~120 MB
  # update into a few megabytes for anyone who is one release behind.
  differentialPackage: true
